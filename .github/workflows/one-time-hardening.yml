name: One-time repository hardening

on:
  push:
    paths:
      - '.github/workflows/one-time-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    if: github.repository == 'generalissimodeslock/bakta-distributed-annotation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove environment-specific e-mail defaults and add SPDX identifiers
        run: |
          python - <<'PY'
          from pathlib import Path

          fleet = Path('scripts/anot00_bakta_01_fleet.py')
          text = fleet.read_text(encoding='utf-8')
          if '# SPDX-License-Identifier: GPL-3.0-only' not in text:
              text = text.replace('# -*- coding: utf-8 -*-\n', '# -*- coding: utf-8 -*-\n# SPDX-License-Identifier: GPL-3.0-only\n', 1)
          text = text.replace(
              'DEFAULT_EMAIL_TO = "ferntsukin@gmail.com"',
              'DEFAULT_EMAIL_TO = os.environ.get("BAKTA_EMAIL_TO", "")',
          )
          text = text.replace(
              'DEFAULT_SMTP_USER = "ferntsukin@gmail.com"',
              'DEFAULT_SMTP_USER = os.environ.get("BAKTA_SMTP_USER", "")',
          )
          marker = '''    if args.cmd == "work" and args.dashboard_interval <= 0:\n        ap.error("--dashboard-interval deve ser maior que zero")\n'''
          replacement = marker + '''    if args.cmd == "work" and args.notify_email:\n        if not args.email_to:\n            ap.error("--notify-email exige --email-to ou a variável BAKTA_EMAIL_TO")\n        if not args.smtp_user:\n            ap.error("--notify-email exige --smtp-user ou a variável BAKTA_SMTP_USER")\n'''
          if 'BAKTA_EMAIL_TO")' not in text and marker in text:
              text = text.replace(marker, replacement, 1)
          fleet.write_text(text, encoding='utf-8')

          selector = Path('scripts/anot00_bakta_02_selecionados.py')
          text = selector.read_text(encoding='utf-8')
          if '# SPDX-License-Identifier: GPL-3.0-only' not in text:
              text = text.replace('# -*- coding: utf-8 -*-\n', '# -*- coding: utf-8 -*-\n# SPDX-License-Identifier: GPL-3.0-only\n', 1)
          selector.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/anot00_bakta_01_fleet.py scripts/anot00_bakta_02_selecionados.py
          git rm .github/workflows/one-time-hardening.yml
      - name: Commit hardening changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/anot00_bakta_01_fleet.py scripts/anot00_bakta_02_selecionados.py .github/workflows/one-time-hardening.yml
          git commit -m 'Harden public scripts'
          git push
