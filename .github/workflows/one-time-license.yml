name: One-time license normalization

on:
  push:
    paths:
      - '.github/workflows/one-time-license.yml'

permissions:
  contents: write

jobs:
  normalize-license:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install full GPL-3.0 text
        run: |
          cp /usr/share/common-licenses/GPL-3 LICENSE
          git rm .github/workflows/one-time-license.yml
      - name: Commit normalized license
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize GPL-3.0 license text'
          git push
