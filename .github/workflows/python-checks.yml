name: Python checks

on:
  push:
  pull_request:

jobs:
  syntax-cli-and-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile scripts
        run: |
          python -m py_compile scripts/anot00_bakta_01_fleet.py
          python -m py_compile scripts/anot00_bakta_02_selecionados.py
      - name: Check command-line help
        run: |
          python scripts/anot00_bakta_01_fleet.py --help >/dev/null
          python scripts/anot00_bakta_02_selecionados.py --help >/dev/null
      - name: Run smoke tests
        run: python -m unittest discover -s tests -v
